name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rust server: type-check + unit tests. No service binding needed; pure cargo.
  rust:
    name: cargo test (v2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2 -> target
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: false
      - name: cargo test
        run: cargo test --workspace --all-targets --locked

  # Front-end: TypeScript compile + production build.
  web-typecheck:
    name: npx tsc (v2/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: v2/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript --noEmit
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  # Deploy-config validation: the Coolify deployment reads docker-compose.yml.
  # Catching a malformed compose file before merge saves a deploy round-trip.
  compose-config:
    name: docker compose config validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
        # `docker compose config --quiet` exits non-zero if the file is malformed.
        # It does NOT try to build or pull images, so it is fast and offline-safe.
