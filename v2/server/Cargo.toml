[package]
name = "paper-oxidizer-server"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }

# Postgres: tokio-postgres is the ONLY Rust client with sslnegotiation=direct
# (>= 0.7.13). sqlx cannot do it (PR #3879 unmerged) and Cloudflare Gateway on
# the VPS drops the negotiated-TLS handshake because its first packet has no
# SNI -- the exact outage this stack already hit once in v1.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
deadpool-postgres = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26"

# R2 presigned GETs. Checksum behaviour must be forced to WhenRequired -- the
# post-1.69 WhenSupported default breaks against R2's S3 compatibility.
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"

argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.13.1"
