# OCR review app.
#
# CREDENTIALS LIVE IN THE COOLIFY UI, NOT IN THIS FILE, so they stay editable
# there. Coolify injects them at run time.
#
# Set these in Coolify. The container refuses to start without all three:
#   NEON_DATABASE_URL       postgres connection string
#   REVIEW_USERS            alden:somepassword,jeff:otherpassword
#   SESSION_SECRET          signs the login cookie. To have Coolify generate it,
#                           set the VALUE in the UI to ${SERVICE_HEX_SESSION} --
#                           Coolify resolves the magic variable from the env
#                           entry itself. It does not need to be referenced here.
#
# Page images -- set ALL FOUR or NONE. A partial set is rejected at startup
# rather than silently falling back to a local render that cannot work in a
# container:
#   R2_BUCKET               dobbins-paperless-scans
#   R2_ENDPOINT             https://<cloudflare-account-id>.r2.cloudflarestorage.com
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#
# Optional, sensible defaults in the app:
#   R2_PREFIX               key prefix, default "pages"
#   R2_SIGN_TTL             signed-URL lifetime in seconds, default 3600
services:
  ocr-review:
    build:
      # This file sits at the repo root so Coolify finds it with no path
      # configuration; the app and its Dockerfile live in review/.
      context: ./review
      dockerfile: Dockerfile
    restart: unless-stopped
    # EXPOSE, NOT PORTS. `ports: 8778:8778` publishes straight onto the VPS
    # interface and bypasses Coolify's proxy -- the app would answer on plain
    # http://<vps-ip>:8778 with no TLS in front. The session cookie is marked
    # Secure off-loopback, so login would also fail there in a way that looks
    # like a bug rather than a misconfiguration. `expose` keeps the port inside
    # Coolify's network; assign the domain in Coolify and its proxy terminates
    # TLS and routes to 8778.
    expose:
      - "8778"
    # SECRETS ARE DELIBERATELY NOT NAMED HERE.
    #
    # Coolify imports every variable a compose file mentions and then binds it
    # to that file: the UI refuses to edit or delete it ("remove it from the
    # Docker Compose file first"). Naming NEON_DATABASE_URL and the R2 keys here
    # made all of them read-only in Coolify -- exactly wrong for credentials
    # that rotate.
    #
    # This stack's convention, the same one Hermes and Papra already follow, is
    # that secrets live in the Coolify UI and Coolify injects them at run time.
    # Set these THERE, not here:
    #
    #   NEON_DATABASE_URL   REVIEW_USERS   SESSION_SECRET
    #   R2_BUCKET   R2_ENDPOINT   R2_ACCESS_KEY_ID   R2_SECRET_ACCESS_KEY
    #   R2_PREFIX     optional, app defaults to "pages"
    #   R2_SIGN_TTL   optional, app defaults to 3600
    #
    # Below is fixed container wiring only -- not secrets, and not things you
    # should ever want to change from the UI.
    environment:
      HOST: 0.0.0.0
      PORT: "8778"
      NO_BROWSER: "1"
    # Coolify writes the variables you set in its UI to a .env beside the
    # generated compose and loads them from there. Declaring it explicitly costs
    # nothing if Coolify already does it, and removes the doubt if it does not.
    # required:false so a local `docker compose` run still works with no .env --
    # locally the app reads the real environment instead.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8778/healthz',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
